            - generic:
              - article:
                - paragraph:
                  - generic: I ·
                  - text: Etimologia
                - heading "Global + local." [level=3]
                - paragraph: "Glocal è una parola ibrida: global e local saldate insieme. Nasce tra gli anni Ottanta e Novanta, quando sociologi ed economisti (Robertson, e poi il motto think globally, act locally) descrivono un fatto già visibile: il mondo si allarga, ma le persone restano da qualche parte. Non è uno slogan da agenzia. È un modo di stare nel mondo senza cancellare il posto da cui si parla."
                - list:
                  - listitem: Una sola parola per due scale che di solito si fanno guerra
                  - listitem: Pensare con lo sguardo largo, agire da dove si è
                  - listitem: Né provincialismo chiuso, né template uguale per tutti
              - article:
                - paragraph:
                  - generic: II ·
                  - text: Lo studio
                - heading "Restare del Veneto." [level=3]
                - paragraph: "Locale, per OnyxCode, è Padova e i comuni intorno: lo studio, la sala d’attesa, il passaparola di chi si è trovato bene. È un lavoro che non ha bisogno di spiegarsi in tre lingue per essere vero. Un sito che ignora questo — che parla come un SaaS di nessun luogo — toglie proprio ciò che distingue un professionista da un portale di prenotazioni."
                - list:
                  - listitem: Un volto, un nome, un indirizzo che esistono già
                  - listitem: Il tono di chi riceve qui, non di un copy generico
                  - listitem: Il territorio come bacino reale, non come limite
              - article:
                - paragraph:
                  - generic: III ·
                  - text: La vetrina
                - heading "Apparire nel mondo." [level=3]
                - paragraph: "Globale non significa cercare pazienti dall’altra parte del mondo. Significa che la pagina deve reggere lo sguardo di chi non ti conosce ancora: chiara al primo colpo, veloce, leggibile sul telefono, senza scuse da “sito fatto in casa”. Il web è la prima sala d’attesa, quella che si vede prima di entrare. Se è lenta o confusa, la telefonata non arriva."
                - list:
                  - listitem: Qualità di lettura e di costruzione, non di fashion week
                  - listitem: Una presenza che non chiede perdono per essere piccola
                  - listitem: Gli stessi standard di chiarezza di uno studio in centro a Padova
              - article:
                - paragraph:
                  - generic: IV ·
                  - text: Il punto
                - heading "Non scegliere." [level=3]
                - paragraph: "Il glocal è il rifiuto del bivio. Non si rinuncia allo studio e al quartiere per sembrare una catena, e non si rinuncia alla qualità per restare “solo locali”. Si tengono entrambi: l’identità di chi sei, e una pagina che funziona come se fosse fatta per chi non ti ha mai incontrato. Questo è il lavoro di OnyxCode — un atelier piccolo che costruisce quella soglia."
                - list:
                  - listitem: Locale nell’origine, globale nella qualità della pagina
                  - listitem: Niente template che cancellano il volto, niente dilettantismo che lo nasconde
                  - listitem: "Dallo studio a chi ti cerca: una direzione, non uno slogan"
